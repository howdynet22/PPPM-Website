<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Performance & Development Tracker</title>

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-container">

<div class="logo">
COMPANY LOGO
</div>

<h2>Employee Performance & Development Tracker</h2>

<p class="subtitle">Sign in to continue</p>

<form id="loginForm">

<label>Email Address</label>
<input type="email" id="email" required>

<label>Password</label>
<input type="password" id="password" required>

<div class="options">

<label style="font-weight:normal;">
<label>
    <input type="checkbox" id="rememberMe">
    Remember Me
</label>

<span style="font-size:12px;color:#6b7280;">Password changes are available after signing in.</span>

</div>

<button type="submit">Sign In</button>

</form>

<div id="message"></div>

<div class="info">
System checks user role and redirects to the correct dashboard:
<ul style="margin-top:10px;margin-left:18px;">
<li>System Administrator</li>
<li>HR</li>
<li>Manager</li>
<li>Employee</li>
</ul>
</div>

<div class="footer">
Version 1.0.0 • support@company.com
</div>

</div>


<script src="Js/login.js"></script>
</body>
</html>
