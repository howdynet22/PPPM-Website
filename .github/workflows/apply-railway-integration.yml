name: Apply Railway integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-railway-integration.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified application patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f deployment.patch
          git am deployment.patch
          git rm deployment.patch .github/workflows/apply-railway-integration.yml
          git commit -m "Remove temporary integration files"
          git push origin HEAD:main
