<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Password Help</title>

    <!-- Shared page styles -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body class="login-page password-help-page">
    <!-- Password recovery instructions -->
    <main class="login-container">
      <h2>Password Help</h2>

      <p>Enter your work email to view the recovery instructions.</p>

      <form id="forgotForm">
        <label for="forgotEmail">Work Email Address</label>
        <input
          type="email"
          id="forgotEmail"
          autocomplete="username"
          placeholder="Email Address"
          required
        />

        <button type="submit">Show Recovery Instructions</button>
      </form>

      <p id="result" role="status" aria-live="polite"></p>

      <a href="index.html"> ← Back to Login </a>
    </main>

    <!-- Password-help functions -->
    <script src="Js/forgot-password.js"></script>
  </body>
</html>
