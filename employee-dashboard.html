<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Dashboard</title>
    <!-- Shared page styles -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="placeholder-dashboard">
    <!-- Employee placeholder content -->
    <main class="shell">
      <div class="card">
        <p class="role" data-user-role>Employee</p>
        <h1>Employee Dashboard</h1>
        <p>
          Signed in as <strong data-user-name></strong> (<span
            data-user-email
          ></span
          >).
        </p>
        <p class="muted">
          Access to this area is checked against your database role and
          permissions. Unauthorized users are redirected automatically.
        </p>
        <div class="grid">
          <div class="item" data-permission="employee.dashboard">
            <strong>Dashboard access</strong>
            <p class="muted">Your employee dashboard permission is active.</p>
          </div>
        </div>
      </div>
    </main>
    <!-- Authentication and permission checks -->
    <script src="Js/auth.js" data-roles="employee"></script>
  </body>
</html>
